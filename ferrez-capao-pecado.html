<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferréz — Capão Pecado</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#fff; color:#37352f; }
  .slider { display:flex; flex-direction:column; width:100%; height:100%; }
  .stage { position:relative; flex:1 1 auto; min-height:0; background:#f7f6f3; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .stage img { max-width:100%; max-height:100%; object-fit:contain; display:none; }
  .stage img.active { display:block; }
  .spinner { position:absolute; width:28px; height:28px; border:3px solid #d3d1cb; border-top-color:#37352f; border-radius:50%; animation:spin 0.8s linear infinite; display:none; }
  .stage.loading .spinner { display:block; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .caption { position:absolute; bottom:0; left:0; right:0; background:rgba(255,255,255,0.92); font-size:12px; padding:6px 10px; color:#37352f; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.85); border:1px solid #e9e8e4; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:18px; line-height:1; color:#37352f; z-index:2; }
  .nav:hover { background:#fff; }
  .prev { left:10px; } .next { right:10px; }
  .dots { flex:0 0 auto; display:flex; justify-content:center; gap:6px; padding:8px 0; background:#fff; }
  .dot { width:8px; height:8px; border-radius:50%; background:#d3d1cb; cursor:pointer; }
  .dot.active { background:#37352f; }
</style>
</head>
<body>
  <div class="slider">
    <div class="stage" id="stage">
      <div class="spinner"></div>
      <button class="nav prev" id="prev" aria-label="Imagem anterior">‹</button>
      <button class="nav next" id="next" aria-label="Próxima imagem">›</button>
      <div class="caption" id="cap"></div>
    </div>
    <div class="dots" id="dots"></div>
  </div>
<script>
  const images = [
    {
        "src": "https://i.ytimg.com/vi/yYVUSSFZQUE/maxresdefault.jpg",
        "caption": "Lançamento da reedição de Capão Pecado — Fonte: YouTube"
    },
    {
        "src": "https://static.wixstatic.com/media/5801fd_10a34a3433bc4d9fbc60a6fac294fd71~mv2_d_1706_2560_s_2.jpg/v1/fill/w_666,h_1000,al_c,q_85,usm_0.66_1.00_0.01/5801fd_10a34a3433bc4d9fbc60a6fac294fd71~mv2_d_1706_2560_s_2.jpg",
        "caption": "Capa/edição de Capão Pecado em resenha literária — Fonte: Bonas Histórias"
    },
    {
        "src": "https://rascunho.com.br/wp-content/uploads/2020/11/ferrez.jpg",
        "caption": "Ferréz na nova edição de Capão Pecado — Fonte: Rascunho"
    },
    {
        "src": "https://upload.wikimedia.org/wikipedia/commons/2/2b/Feira_de_Frankfurt_2013_%2810276733426%29.jpg",
        "caption": "Ferréz em registro público de autor — Fonte: Wikimedia Commons"
    }
];
  const MAX_W = 1280;
  const stage = document.getElementById('stage');
  const dotsBox = document.getElementById('dots');
  const cap = document.getElementById('cap');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const imgEls = [];
  let current = 0;
  function resolve(src) {
    return src.includes('Special:FilePath')
      ? src + (src.includes('?') ? '&' : '?') + 'width=' + MAX_W
      : src;
  }
  function load(i) {
    if (i < 0 || i >= images.length) return;
    const el = imgEls[i];
    if (el && !el.dataset.loaded) { el.dataset.loaded = '1'; el.src = resolve(images[i].src); }
  }
  function preloadNeighbors() {
    requestAnimationFrame(() => { load(current + 1); load(current - 1); });
  }
  function build() {
    images.forEach((item, i) => {
      const img = document.createElement('img');
      img.alt = item.caption || '';
      img.decoding = 'async';
      stage.insertBefore(img, prev);
      imgEls[i] = img;
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.onclick = () => { current = i; update(); };
      dotsBox.appendChild(dot);
    });
  }
  function update() {
    load(current);
    const cur = imgEls[current];
    if (cur.complete) { stage.classList.remove('loading'); preloadNeighbors(); }
    else {
      stage.classList.add('loading');
      cur.onload = () => { stage.classList.remove('loading'); preloadNeighbors(); };
      cur.onerror = () => stage.classList.remove('loading');
    }
    imgEls.forEach((el, i) => el.classList.toggle('active', i === current));
    [...dotsBox.children].forEach((d, i) => d.classList.toggle('active', i === current));
    const multi = images.length > 1;
    prev.style.display = multi ? 'block' : 'none';
    next.style.display = multi ? 'block' : 'none';
    cap.textContent = images[current] ? images[current].caption : '';
    cap.style.display = cap.textContent ? 'block' : 'none';
  }
  function go(s) { current = (current + s + images.length) % images.length; update(); }
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  document.addEventListener('keydown', e => { if (e.key==='ArrowLeft') go(-1); if (e.key==='ArrowRight') go(1); });
  build();
  update();
</script>
</body>
</html>
